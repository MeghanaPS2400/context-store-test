      severity: HIGH
      validation_logic: worker_type IS NOT NULL
    - rule_id: worker_national_id_data_worker_type_lookup_existence_check
      sub_category: LOOKUP_EXISTENCE_CHECK
      description: Field values must exist in the approved reference dataset.
      severity: HIGH
      validation_logic: worker_type exists in reference dataset
    - rule_id: worker_national_id_data_worker_type_required_field_check
      sub_category: REQUIRED_FIELD_CHECK
      description: worker_type is marked as Required
      severity: HIGH
      validation_logic: worker_type IS NOT NULL
    - rule_id: worker_national_id_data_worker_type_data_type_check_2
      sub_category: DATA_TYPE_CHECK
      description: 'Worker Type: lookup transformation missing reference'
      severity: HIGH
