- name: worker_id
  description: Worker ID
  dtype: Text
  nullable: false
  primary_key: 2.1.1
  unique: false
  quality_checks:
    GENERAL:
    - rule_id: worker_name_data_worker_id_data_type_check
      sub_category: DATA_TYPE_CHECK
      description: Field values must conform to the declared Text data type.
      severity: HIGH
      validation_logic: TRY_CAST(worker_id AS Text) IS NOT NULL OR worker_id IS NULL
    - rule_id: worker_name_data_worker_id_not_null_check
      sub_category: NOT_NULL_CHECK
      description: Field must contain a value for all records.
      severity: HIGH
      validation_logic: worker_id IS NOT NULL
    - rule_id: worker_name_data_worker_id_required_field_check
      sub_category: REQUIRED_FIELD_CHECK
      description: worker_id is marked as Required
      severity: HIGH
      validation_logic: worker_id IS NOT NULL
