table_name: default_compensation_positions
description: Default Compensation Positions table in human_resources domain
domain: human_resources
columns:
- name: position_id
  description: Position ID
  dtype: Text
  nullable: false
  primary_key: 3.11.1
  unique: false
  quality_checks:
    GENERAL:
    - rule_id: default_compensation_positions_position_id_data_type_check
      sub_category: DATA_TYPE_CHECK
      description: Field values must conform to the declared Text data type.
      severity: HIGH
      validation_logic: TRY_CAST(position_id AS Text) IS NOT NULL OR position_id IS NULL
    - rule_id: default_compensation_positions_position_id_not_null_check
      sub_category: NOT_NULL_CHECK
      description: Field must contain a value for all records.
      severity: HIGH
      validation_logic: position_id IS NOT NULL
    - rule_id: default_compensation_positions_position_id_required_field_check
      sub_category: REQUIRED_FIELD_CHECK
      description: position_id is required
      severity: HIGH
      validation_logic: position_id IS NOT NULL
