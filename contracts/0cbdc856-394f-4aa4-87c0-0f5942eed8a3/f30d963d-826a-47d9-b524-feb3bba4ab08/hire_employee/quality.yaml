table_name: hire_employee
description: Hire Employee table in human_resources domain.
domain: human_resources
primary_key:
- employee_id_associate_id
columns:
- name: employee_id_associate_id
  description: Employee ID (Associate ID)
  dtype: Text
  nullable: false
  primary_key: true
  unique: true
  quality_checks:
  - table_name: hire_employee
    rule_category: GENERAL
    sub_category: DATA_TYPE_CHECK
    description: Field values must conform to the declared Text data type.
    severity: HIGH
    validation_logic: TRY_CAST(employee_id_associate_id AS Text) IS NOT NULL OR employee_id_associate_id IS NULL
    business_impact: Type-mismatched values break downstream loaders, joins, and analytics.
    related_columns: []
  - table_name: hire_employee
    rule_category: GENERAL
    sub_category: NOT_NULL_CHECK
    description: Field must contain a value for all records.
    severity: HIGH
    validation_logic: employee_id_associate_id IS NOT NULL
    business_impact: Missing values may impact downstream analytics and business reporting.
    related_columns: []
  - table_name: hire_employee
    rule_category: GENERAL
    sub_category: UNIQUE_CHECK
    description: Field values must be unique.
    severity: HIGH
    validation_logic: COUNT(DISTINCT employee_id_associate_id) = COUNT(employee_id_associate_id)
    business_impact: Duplicate identifiers may cause duplicate entities.
    related_columns: []
  - table_name: hire_employee
    rule_category: GENERAL
    sub_category: NOT_NULL_CHECK
    description: Employee ID (Associate ID) is required as a primary key.
    severity: HIGH
    validation_logic: employee_id_associate_id IS NOT NULL
    related_columns: []
  - table_name: hire_employee
    rule_category: GENERAL
    sub_category: UNIQUE_CHECK
    description: Employee ID (Associate ID) must be unique as a primary key.
    severity: HIGH
    validation_logic: COUNT(DISTINCT employee_id_associate_id) = COUNT(employee_id_associate_id)
    related_columns: []
  profiling: {}
